<ion-content [fullscreen]="true" class="login-content">
  <main class="login-shell">
    <section class="brand-section" aria-label="Priangan Kilat Express courier login">
      <div class="brand-mark">⚡</div>
      <h1>Priangan Kilat Express</h1>
      <p>Login Aplikasi Kurir</p>
    </section>

    <form class="login-card" (ngSubmit)="login()">
      <div class="field-group">
        <label for="kodeKurir">Kode Kurir</label>
        <ion-input
          id="kodeKurir"
          name="kodeKurir"
          [(ngModel)]="kodeKurir"
          fill="outline"
          placeholder="KUR-01"
          autocomplete="username"
          [disabled]="isSubmitting"
        ></ion-input>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="password-shell">
          <ion-input
            id="password"
            name="password"
            [(ngModel)]="password"
            fill="outline"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            autocomplete="current-password"
            [disabled]="isSubmitting"
          ></ion-input>
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
          >
            {{ showPassword ? 'Sembunyikan' : 'Lihat' }}
          </button>
        </div>
      </div>

      @if (errorMessage) {
      <p class="error-message" role="alert">{{ errorMessage }}</p>
      }

      <ion-button type="submit" expand="block" class="login-button" [disabled]="isSubmitting">
        @if (isSubmitting) {
        <ion-spinner name="crescent"></ion-spinner>
        } @else {
        <span>Masuk</span>
        }
      </ion-button>
    </form>

    <p class="footer-text">&copy; {{ 2026 }} Priangan Kilat Express</p>
  </main>
</ion-content>
