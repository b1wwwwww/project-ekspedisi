<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ganti Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="password-content">
  <main class="password-shell">
    <section class="page-heading">
      <h1>Perbarui Password</h1>
      <p>Gunakan password baru minimal 8 karakter.</p>
    </section>

    <form class="password-card" (ngSubmit)="gantiPassword()">
      <div class="field-group">
        <label for="passwordLama">Password Lama</label>
        <ion-input
          id="passwordLama"
          name="passwordLama"
          [(ngModel)]="passwordLama"
          type="password"
          fill="outline"
          placeholder="Masukkan password lama"
          autocomplete="current-password"
          [disabled]="isSubmitting"
        ></ion-input>
      </div>

      <div class="field-group">
        <label for="passwordBaru">Password Baru</label>
        <ion-input
          id="passwordBaru"
          name="passwordBaru"
          [(ngModel)]="passwordBaru"
          type="password"
          fill="outline"
          placeholder="Minimal 8 karakter"
          autocomplete="new-password"
          [disabled]="isSubmitting"
        ></ion-input>
      </div>

      <div class="field-group">
        <label for="passwordKonfirmasi">Konfirmasi Password Baru</label>
        <ion-input
          id="passwordKonfirmasi"
          name="passwordKonfirmasi"
          [(ngModel)]="passwordKonfirmasi"
          type="password"
          fill="outline"
          placeholder="Ulangi password baru"
          autocomplete="new-password"
          [disabled]="isSubmitting"
        ></ion-input>
      </div>

      <ion-button type="submit" expand="block" class="password-button" [disabled]="isSubmitting">
        @if (isSubmitting) {
        <ion-spinner name="crescent"></ion-spinner>
        } @else {
        <span>Simpan Password</span>
        }
      </ion-button>
    </form>
  </main>
</ion-content>
